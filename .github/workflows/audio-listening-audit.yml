name: Audit perceived audio mismatch
on:
  push:
    branches: ['diagnostics/audio-loudness-audit']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Ensure FFmpeg
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Measure exact demo pairs before and after published gains
        run: python3 scripts/listening-audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: audio-listening-audit
          path: listening-audit.json
