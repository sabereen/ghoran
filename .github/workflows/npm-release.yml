name: Publish to npm

on:
  push:
    tags: ['npm-*']
    # One-time OIDC bootstrap: publish when this workflow changes on main.
    branches: ['main']
    paths: ['.github/workflows/npm-release.yml']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate publishing without uploading to npm
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Only release commits from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm release:pack && pnpm release:dry-run
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-release
          path: work/npm-release/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: verify
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - run: npm install --global npm@11.21.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-release
          path: work/npm-release/
      - name: Verify npm trusted publishing access
        run: |
          node --input-type=module <<'NODE'
          const tokenUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL
          const tokenAuth = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN
          if (!tokenUrl || !tokenAuth) throw Error('GitHub OIDC token permission is missing')
          const url = new URL(tokenUrl)
          url.searchParams.set('audience', 'npm:registry.npmjs.org')
          const oidc = await fetch(url, { headers: { Authorization: `Bearer ${tokenAuth}` } })
          if (!oidc.ok) throw Error(`Cannot request GitHub OIDC ID token: HTTP ${oidc.status}`)
          const { value: idToken } = await oidc.json()
          if (!idToken) throw Error('GitHub returned no OIDC ID token')
          const names = ['font-page', 'entity', 'metadata', 'text', 'translation', 'utils']
          let failures = 0
          for (const name of names) {
            const pkg = `@ghoran/${name}`
            const endpoint = `https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/${encodeURIComponent(pkg)}`
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: { Authorization: `Bearer ${idToken}` },
            })
            console.log(`${pkg}: npm OIDC exchange HTTP ${response.status}`)
            if (!response.ok) failures++
          }
          if (failures) throw Error(`${failures} package(s) rejected the npm OIDC trust exchange; check Trusted Publisher settings and Allowed actions`)
          NODE
      - run: node scripts/release.mjs publish
